version: "3"
dotenv:
  - .local.env
vars:
  VERSION: '{{default "dev" .VERSION}}'
  ZIG_CACHE_DIR: '{{joinPath .ROOT_DIR ".zig-cache"}}'
  ZIG_GLOBAL_CACHE_DIR: '{{joinPath .ROOT_DIR ".zig-global-cache"}}'
  HOST_ZIG_TARGET:
    sh: |
      os=$(go env GOOS); arch=$(go env GOARCH)
      case "${os}-${arch}" in
        linux-amd64)  echo "x86_64-linux-gnu"   ;;
        linux-arm64)  echo "aarch64-linux-gnu"  ;;
        darwin-amd64) echo "x86_64-macos"       ;;
        darwin-arm64) echo "aarch64-macos"      ;;
        *) echo "unsupported: ${os}-${arch}" >&2; exit 1 ;;
      esac
  MACOS_SDKROOT:
    sh: |
      if [ "{{OS}}" = "darwin" ]; then
        xcrun --sdk macosx --show-sdk-path
      fi
  HOST_CC:
    sh: |
      if [ "$(go env GOOS)" = "darwin" ]; then
        sdk="{{.MACOS_SDKROOT}}"
        printf "%s" "zig cc -target {{.HOST_ZIG_TARGET}} -isysroot ${sdk} -F${sdk}/System/Library/Frameworks -L${sdk}/usr/lib"
      else
        echo "zig cc -target {{.HOST_ZIG_TARGET}}"
      fi
  HOST_CXX:
    sh: |
      if [ "$(go env GOOS)" = "darwin" ]; then
        sdk="{{.MACOS_SDKROOT}}"
        printf "%s" "zig c++ -target {{.HOST_ZIG_TARGET}} -isysroot ${sdk} -F${sdk}/System/Library/Frameworks -L${sdk}/usr/lib"
      else
        echo "zig c++ -target {{.HOST_ZIG_TARGET}}"
      fi
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  GO_LDFLAGS: >-
    -s -w
    -X main.ver={{.VERSION}}
    -X github.com/onixhdz/cartograph/internal/version.BuildVersion={{.VERSION}}
    -X github.com/onixhdz/cartograph/internal/version.BuildCommit={{.GIT_COMMIT}}
    -X github.com/onixhdz/cartograph/internal/version.BuildDate={{.BUILD_DATE}}
  EMBEDDING_LIB_DIR: internal/embedding/local
tasks:
  clean:
    desc: Remove generated build artifacts, Zig caches, and Task cache
    cmds:
      - task: clean:zig
      - rm -rf '{{joinPath .ROOT_DIR ".task"}}'
      - rm -rf '{{joinPath .ROOT_DIR "plugins/bin"}}'
      - rm -f '{{joinPath .ROOT_DIR "cartograph"}}' '{{joinPath .ROOT_DIR "cartograph-darwin-amd64"}}' '{{joinPath .ROOT_DIR "cartograph-darwin-arm64"}}' '{{joinPath .ROOT_DIR "cartograph-linux-amd64"}}' '{{joinPath .ROOT_DIR "cartograph-linux-arm64"}}' '{{joinPath .ROOT_DIR "cartograph-windows-amd64.exe"}}'

  clean:artifacts:
    desc: Remove generated build artifacts but keep caches
    cmds:
      - rm -rf '{{joinPath .ROOT_DIR "plugins/bin"}}'
      - rm -f '{{joinPath .ROOT_DIR "cartograph"}}' '{{joinPath .ROOT_DIR "cartograph-darwin-amd64"}}' '{{joinPath .ROOT_DIR "cartograph-darwin-arm64"}}' '{{joinPath .ROOT_DIR "cartograph-linux-amd64"}}' '{{joinPath .ROOT_DIR "cartograph-linux-arm64"}}' '{{joinPath .ROOT_DIR "cartograph-windows-amd64.exe"}}'

  clean:zig:
    desc: Remove Zig build artifacts and caches
    dir: "{{.EMBEDDING_LIB_DIR}}"
    cmds:
      - rm -rf zig-out .zig-cache .zig-target.stamp '{{.ZIG_CACHE_DIR}}' '{{.ZIG_GLOBAL_CACHE_DIR}}'

  test:
    desc: Run unit tests without the native embedding backend (no Zig)
    cmds:
      - CGO_ENABLED=1 go test -short ./...

  test:embedding:
    desc: Run embedding tests with the native backend (Zig + embedding_cgo tag)
    deps:
      - task: build:embedding:lib
        vars: { TARGET: "{{.HOST_ZIG_TARGET}}" }
    cmds:
      - mkdir -p '{{.ZIG_CACHE_DIR}}'
      - mkdir -p '{{.ZIG_GLOBAL_CACHE_DIR}}'
      - >
        ZIG_LOCAL_CACHE_DIR='{{.ZIG_CACHE_DIR}}'
        ZIG_GLOBAL_CACHE_DIR='{{.ZIG_GLOBAL_CACHE_DIR}}'
        SDKROOT='{{.MACOS_SDKROOT}}'
        CGO_ENABLED=1
        CC='{{.HOST_CC}}'
        CXX='{{.HOST_CXX}}'
        go test -tags embedding_cgo -short ./internal/embedding/... ./internal/service/... ./cmd/...

  test:integration:
    desc: Run all tests including network/integration and the native backend
    deps:
      - task: build:embedding:lib
        vars: { TARGET: "{{.HOST_ZIG_TARGET}}" }
    cmds:
      - mkdir -p '{{.ZIG_CACHE_DIR}}'
      - mkdir -p '{{.ZIG_GLOBAL_CACHE_DIR}}'
      - >
        ZIG_LOCAL_CACHE_DIR='{{.ZIG_CACHE_DIR}}'
        ZIG_GLOBAL_CACHE_DIR='{{.ZIG_GLOBAL_CACHE_DIR}}'
        SDKROOT='{{.MACOS_SDKROOT}}'
        CGO_ENABLED=1
        CC='{{.HOST_CC}}'
        CXX='{{.HOST_CXX}}'
        go test -tags embedding_cgo -count=1 ./...

  codeql:
    desc: Build Go packages for CodeQL extraction
    deps:
      - task: build:embedding:lib
        vars: { TARGET: "{{.HOST_ZIG_TARGET}}" }
    cmds:
      - mkdir -p '{{.ZIG_CACHE_DIR}}'
      - mkdir -p '{{.ZIG_GLOBAL_CACHE_DIR}}'
      - >
        ZIG_LOCAL_CACHE_DIR='{{.ZIG_CACHE_DIR}}'
        ZIG_GLOBAL_CACHE_DIR='{{.ZIG_GLOBAL_CACHE_DIR}}'
        SDKROOT='{{.MACOS_SDKROOT}}'
        CGO_ENABLED=1
        CC='{{.HOST_CC}}'
        CXX='{{.HOST_CXX}}'
        "${CODEQL_ACTION_GO_BINARY:-go}" build -tags embedding_cgo ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  vuln:
    desc: Run Go vulnerability analysis
    cmds:
      - go tool govulncheck ./...

  build:
    desc: Build cartograph for all supported platforms (native CGO)
    cmds:
      - task: build:target:linux
      - task: build:target:mac
      - task: build:target:windows

  build:plugins:
    desc: Build all plugin binaries
    cmds:
      - mkdir -p '{{joinPath .ROOT_DIR "plugins/bin"}}'
      - >
        for main in plugins/*/main.go; do
          [ -f "$main" ] || continue
          dir=$(dirname "$main")
          name=$(basename "$dir")
          echo "Building plugin: $name"
          go build -trimpath -o "{{joinPath .ROOT_DIR "plugins/bin"}}/$name" "./$dir"
        done

  build:target:linux:
    desc: Build cartograph for all Linux targets
    cmds:
      - task: build:target:linux:amd64
      - task: build:target:linux:arm64

  # ── Zig native library ──────────────────────────────────────────────

  build:embedding:lib:
    desc: Build native inference library via Zig (host or cross with TARGET=)
    dir: "{{.EMBEDDING_LIB_DIR}}"
    vars:
      EMBEDDING_LIB_FILE:
        sh: |
          case "{{.TARGET}}" in
            x86_64-windows-gnu) echo "inference.lib" ;;
            *) echo "libinference.a" ;;
          esac
    status:
      - test -f zig-out/lib/{{.EMBEDDING_LIB_FILE}}
      - test -f zig-out/include/inference.h
      - test -f .zig-target.stamp
      - test "$(cat .zig-target.stamp)" = "{{.TARGET}}"
    cmds:
      - mkdir -p '{{.ZIG_CACHE_DIR}}'
      - mkdir -p '{{.ZIG_GLOBAL_CACHE_DIR}}'
      - rm -rf zig-out
      - >
        ZIG_LOCAL_CACHE_DIR='{{.ZIG_CACHE_DIR}}'
        ZIG_GLOBAL_CACHE_DIR='{{.ZIG_GLOBAL_CACHE_DIR}}'
        zig build native -Doptimize=ReleaseFast {{if .TARGET}}-Dtarget={{.TARGET}}{{end}}
      - echo "{{.TARGET}}" > .zig-target.stamp
      - echo "✓ {{.EMBEDDING_LIB_FILE}} [{{.TARGET}}] ($(du -h zig-out/lib/{{.EMBEDDING_LIB_FILE}} | cut -f1))"

  # ── Dev build (auto-detect host) ────────────────────────────────────

  build:dev:
    desc: Build cartograph for the current host OS/arch
    vars:
      BIN_NAME: "cartograph-{{OS}}-{{ARCH}}"
      EXTRA_LDFLAGS:
        sh: |
          case "$(go env GOOS)" in
            linux)  echo "-linkmode external -extldflags '-static'" ;;
            darwin) echo "-extldflags '-undefined dynamic_lookup'"  ;;
          esac
    deps:
      - task: build:embedding:lib
        vars: { TARGET: "{{.HOST_ZIG_TARGET}}" }
    sources:
      - ./**/*.go
      - go.mod
      - "{{.EMBEDDING_LIB_DIR}}/zig-out/lib/libinference.a"
    generates:
      - "{{.BIN_NAME}}"
    cmds:
      - mkdir -p '{{.ZIG_CACHE_DIR}}'
      - mkdir -p '{{.ZIG_GLOBAL_CACHE_DIR}}'
      - >
        ZIG_LOCAL_CACHE_DIR='{{.ZIG_CACHE_DIR}}'
        ZIG_GLOBAL_CACHE_DIR='{{.ZIG_GLOBAL_CACHE_DIR}}'
        SDKROOT='{{.MACOS_SDKROOT}}'
        CGO_ENABLED=1
        CC='{{.HOST_CC}}'
        CXX='{{.HOST_CXX}}'
        go build -trimpath -tags embedding_cgo
        -ldflags "{{.GO_LDFLAGS}} {{.EXTRA_LDFLAGS}}"
        -o {{.BIN_NAME}} ./cmd/cartograph
      - echo "✓ {{.BIN_NAME}} ($(du -h {{.BIN_NAME}} | cut -f1))"

  # ── Dev symlink ─────────────────────────────────────────────────────

  ln:
    desc: Symlink the host-matching binary to ~/.local/bin/cartograph
    vars:
      BIN: '{{joinPath .TASK_DIR (printf "cartograph-%s-%s" OS ARCH)}}'
    cmds:
      - mkdir -p ~/.local/bin
      - ln -sf {{.BIN}} ~/.local/bin/cartograph
      - echo "✓ ~/.local/bin/cartograph → {{.BIN}}"

  # ── Platform targets (all native CGO) ───────────────────────────────

  build:target:linux:amd64:
    desc: Build cartograph for Linux (x86_64) — native CGO, static (musl)
    deps:
      - task: build:embedding:lib
        vars: { TARGET: "x86_64-linux-musl" }
    sources:
      - ./**/*.go
      - go.mod
      - "{{.EMBEDDING_LIB_DIR}}/zig-out/lib/libinference.a"
    generates:
      - cartograph-linux-amd64
    cmds:
      - mkdir -p '{{.ZIG_CACHE_DIR}}'
      - mkdir -p '{{.ZIG_GLOBAL_CACHE_DIR}}'
      - >
        ZIG_LOCAL_CACHE_DIR='{{.ZIG_CACHE_DIR}}'
        ZIG_GLOBAL_CACHE_DIR='{{.ZIG_GLOBAL_CACHE_DIR}}'
        CGO_ENABLED=1
        GOOS=linux
        GOARCH=amd64
        CC='zig cc -target x86_64-linux-musl'
        CXX='zig c++ -target x86_64-linux-musl'
        go build -trimpath -tags embedding_cgo
        -ldflags "{{.GO_LDFLAGS}} -linkmode external -extldflags '-static'"
        -o cartograph-linux-amd64 ./cmd/cartograph

  build:target:linux:arm64:
    desc: Build cartograph for Linux (aarch64) — native CGO, static (musl)
    deps:
      - task: build:embedding:lib
        vars: { TARGET: "aarch64-linux-musl" }
    sources:
      - ./**/*.go
      - go.mod
      - "{{.EMBEDDING_LIB_DIR}}/zig-out/lib/libinference.a"
    generates:
      - cartograph-linux-arm64
    cmds:
      - mkdir -p '{{.ZIG_CACHE_DIR}}'
      - mkdir -p '{{.ZIG_GLOBAL_CACHE_DIR}}'
      - >
        ZIG_LOCAL_CACHE_DIR='{{.ZIG_CACHE_DIR}}'
        ZIG_GLOBAL_CACHE_DIR='{{.ZIG_GLOBAL_CACHE_DIR}}'
        CGO_ENABLED=1
        GOOS=linux
        GOARCH=arm64
        CC='zig cc -target aarch64-linux-musl'
        CXX='zig c++ -target aarch64-linux-musl'
        go build -trimpath -tags embedding_cgo
        -ldflags "{{.GO_LDFLAGS}} -linkmode external -extldflags '-static'"
        -o cartograph-linux-arm64 ./cmd/cartograph

  build:target:mac:
    desc: Build cartograph for all macOS targets
    cmds:
      - task: build:target:mac:arm64
      - task: build:target:mac:amd64

  build:target:mac:arm64:
    desc: Build cartograph for macOS (Apple Silicon) — native CGO
    deps:
      - task: build:embedding:lib
        vars: { TARGET: "aarch64-macos" }
    sources:
      - ./**/*.go
      - go.mod
      - "{{.EMBEDDING_LIB_DIR}}/zig-out/lib/libinference.a"
    generates:
      - cartograph-darwin-arm64
    cmds:
      - mkdir -p '{{.ZIG_CACHE_DIR}}'
      - mkdir -p '{{.ZIG_GLOBAL_CACHE_DIR}}'
      - >
        ZIG_LOCAL_CACHE_DIR='{{.ZIG_CACHE_DIR}}'
        ZIG_GLOBAL_CACHE_DIR='{{.ZIG_GLOBAL_CACHE_DIR}}'
        CGO_ENABLED=1
        GOOS=darwin
        GOARCH=arm64
        CC='zig cc -target aarch64-macos'
        CXX='zig c++ -target aarch64-macos'
        go build -trimpath -tags embedding_cgo
        -ldflags "{{.GO_LDFLAGS}} -extldflags '-undefined dynamic_lookup'"
        -o cartograph-darwin-arm64 ./cmd/cartograph
      - |
        if command -v codesign >/dev/null 2>&1; then
          codesign --force --sign - cartograph-darwin-arm64
          echo "✓ Ad-hoc signed cartograph-darwin-arm64"
        else
          echo "⚠ codesign not available (not on macOS) — skip signing"
        fi

  build:target:mac:amd64:
    desc: Build cartograph for macOS (Intel) — native CGO
    deps:
      - task: build:embedding:lib
        vars: { TARGET: "x86_64-macos" }
    sources:
      - ./**/*.go
      - go.mod
      - "{{.EMBEDDING_LIB_DIR}}/zig-out/lib/libinference.a"
    generates:
      - cartograph-darwin-amd64
    cmds:
      - mkdir -p '{{.ZIG_CACHE_DIR}}'
      - mkdir -p '{{.ZIG_GLOBAL_CACHE_DIR}}'
      - >
        ZIG_LOCAL_CACHE_DIR='{{.ZIG_CACHE_DIR}}'
        ZIG_GLOBAL_CACHE_DIR='{{.ZIG_GLOBAL_CACHE_DIR}}'
        CGO_ENABLED=1
        GOOS=darwin
        GOARCH=amd64
        CC='zig cc -target x86_64-macos'
        CXX='zig c++ -target x86_64-macos'
        go build -trimpath -tags embedding_cgo
        -ldflags "{{.GO_LDFLAGS}} -extldflags '-undefined dynamic_lookup'"
        -o cartograph-darwin-amd64 ./cmd/cartograph
      - |
        if command -v codesign >/dev/null 2>&1; then
          codesign --force --sign - cartograph-darwin-amd64
          echo "✓ Ad-hoc signed cartograph-darwin-amd64"
        else
          echo "⚠ codesign not available (not on macOS) — skip signing"
        fi

  build:target:windows:
    desc: Build cartograph for Windows (x86_64) — native CGO
    deps:
      - task: build:embedding:lib
        vars: { TARGET: "x86_64-windows-gnu" }
    sources:
      - ./**/*.go
      - go.mod
      - "{{.EMBEDDING_LIB_DIR}}/zig-out/lib/inference.lib"
    generates:
      - cartograph-windows-amd64.exe
    cmds:
      - mkdir -p '{{.ZIG_CACHE_DIR}}'
      - mkdir -p '{{.ZIG_GLOBAL_CACHE_DIR}}'
      - >
        ZIG_LOCAL_CACHE_DIR='{{.ZIG_CACHE_DIR}}'
        ZIG_GLOBAL_CACHE_DIR='{{.ZIG_GLOBAL_CACHE_DIR}}'
        CGO_ENABLED=1
        GOOS=windows
        GOARCH=amd64
        CC='zig cc -target x86_64-windows-gnu'
        CXX='zig c++ -target x86_64-windows-gnu'
        go build -trimpath -tags embedding_cgo
        -ldflags "{{.GO_LDFLAGS}}"
        -o cartograph-windows-amd64.exe ./cmd/cartograph
