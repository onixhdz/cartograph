name: Release

on:
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
      CC: zig cc
      CXX: zig c++
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
          use-cache: true

      - uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: 3.x

      - name: Clean generated artifacts
        run: task clean:artifacts

      - name: Build native embedding prereqs
        run: task build:embedding:lib

      - name: Run linter
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.11

      - name: Run tests
        run: task test

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: build:target:linux:amd64
            artifact: cartograph-linux-amd64
          - task: build:target:linux:arm64
            artifact: cartograph-linux-arm64
          - task: build:target:mac:arm64
            artifact: cartograph-darwin-arm64
          - task: build:target:mac:amd64
            artifact: cartograph-darwin-amd64
          - task: build:target:windows
            artifact: cartograph-windows-amd64.exe
    env:
      CGO_ENABLED: '1'
      CC: zig cc
      CXX: zig c++
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
          use-cache: true

      - uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: 3.x

      - name: Clean generated artifacts
        run: task clean:artifacts

      - name: Build target
        run: task ${{ matrix.task }} VERSION=${GITHUB_REF_NAME}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mv dist/cartograph-linux-amd64/cartograph-linux-amd64 .
          mv dist/cartograph-linux-arm64/cartograph-linux-arm64 .
          mv dist/cartograph-darwin-amd64/cartograph-darwin-amd64 .
          mv dist/cartograph-darwin-arm64/cartograph-darwin-arm64 .
          mv dist/cartograph-windows-amd64.exe/cartograph-windows-amd64.exe .

      - name: Generate checksums
        run: |
          sha256sum cartograph-linux-amd64 \
                    cartograph-linux-arm64 \
                    cartograph-darwin-amd64 \
                    cartograph-darwin-arm64 \
                    cartograph-windows-amd64.exe \
            > checksums-sha256.txt

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            cartograph-linux-amd64
            cartograph-linux-arm64
            cartograph-darwin-amd64
            cartograph-darwin-arm64
            cartograph-windows-amd64.exe

      - name: Extract tag annotation
        run: |
          git fetch origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" --force 2>/dev/null || true
          git cat-file -p "${GITHUB_REF_NAME}" | sed '1,/^$/d' > release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            cartograph-linux-amd64
            cartograph-linux-arm64
            cartograph-darwin-amd64
            cartograph-darwin-arm64
            cartograph-windows-amd64.exe
            checksums-sha256.txt

  update-tap:
    needs: publish
    if: ${{ !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-rc') }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch formula update
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          jq -n '{event_type: "formula-update", client_payload: {tag: "${{ github.ref_name }}", formula: "cartograph"}}' \
            | gh api repos/realxen/homebrew-tap/dispatches --input -
